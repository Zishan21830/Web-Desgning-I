<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <form action="thank_you.html" method="get" name="registration">
<!-- method="get/post" -->
        <!-- Name -->
        <label for="name">Name</label>
        <input type="text" id="name" name="username" placeholder="Zishan" required>

        <br/>
        <!-- email -->
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="z@gmail.com" required>

        <br/>
        <!-- phone -->
        <label for="phone">Phone</label>
        <input type="number" id="phone" name="phone" minlength="10" maxlength="12">

        <!-- Gender -->
         <p>Gender:</p>
         <label for="male">Male</label>
         <input type="radio" name="gender" id="male" value="male">

         <label for="female">Female</label>
         <input type="radio" name="gender" id="female" value="female">
        <br/>
        <select name="" id="">
            <optgroup label="Fruits">
                <option value="apple">Apple</option>
                <option value="banana">Banana</option>
                <option value="fig">fig</option>
            </optgroup>
            <optgroup label="Vegetable" disabled>
                <option value="bootle-gaurd">Bootle-Gaurd</option>
                <option value="Tomato">Tomato</option>
                <option value="chilli">Chilli</option>

            </optgroup>
        </select>
         <input type="submit" value="Signup">
    </form>
</body>
</html>
